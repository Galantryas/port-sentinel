[package]
name = "port-sentinel"
version = "0.1.0"
description = "Port Sentinel & Dev Monitor System Tray Utility"
authors = ["Dev Monitor Team"]
edition = "2021"

[lib]
name = "port_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
sysinfo = "0.30"
netstat2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
